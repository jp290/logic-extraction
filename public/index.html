<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020202">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%238b5cf6'/%3E%3C/svg%3E">
  <title>Logic Extraction — Reasoning Lenses for AI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="modules/extract.css">
  <link rel="stylesheet" href="modules/interview.css">
  <link rel="stylesheet" href="modules/consult.css">
  <link rel="stylesheet" href="modules/library.css">
  <link rel="stylesheet" href="modules/process.css">
  <link rel="stylesheet" href="modules/packs.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module" integrity="sha384-fzqD3KLclV6zyTSuToNuSG370CipiqN572vfT2zti7ORKnQPaJrvsz8deY+/Tgwe" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs" type="module" integrity="sha384-RTiLhGDoA0SEd0K0E9qrg2HwSEEnAo91MwUh79PteR4v01eEByhHOdEkFKxeaeqw" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>

  <style>
    /* Ambient background — same drift as landing */
    .bg { position: fixed; inset: 0; z-index: -1; background: var(--bg); }
    .bg::after {
      content: ''; position: absolute; inset: -50%; width: 200%; height: 200%;
      background:
        radial-gradient(circle at 20% 20%, var(--accent-a8) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(59,130,246,0.03) 0%, transparent 40%);
      filter: blur(80px);
      animation: drift 40s infinite alternate ease-in-out;
    }
    @keyframes drift { 0% { transform: translate(0,0) rotate(0deg); } 100% { transform: translate(80px,40px) rotate(3deg); } }

    /* Nav */
    .nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; justify-content: center;
      padding: var(--space-3) var(--space-5);
    }
    .nav-links {
      display: flex; align-items: center; gap: 2px;
      background: rgba(2,2,2,0.65);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 3px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    .nav-home {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px;
      color: var(--text-3); text-decoration: none;
      border-radius: 50%;
      transition: color var(--dur-fast) var(--ease),
                  background var(--dur-fast) var(--ease);
      flex-shrink: 0;
    }
    .nav-home:hover { color: var(--text); background: var(--glass-2); text-decoration: none; }
    .nav-sep {
      width: 1px; height: 20px;
      background: var(--border); margin: 0 4px;
      flex-shrink: 0;
    }
    .nav-link {
      font-family: var(--font); font-size: var(--fs-sm); font-weight: var(--fw-medium);
      letter-spacing: 0.01em;
      color: var(--text-3); text-decoration: none;
      padding: 8px 24px;
      border-radius: var(--radius-pill);
      transition: color var(--dur-fast) var(--ease),
                  background var(--dur-fast) var(--ease);
    }
    .nav-link:hover { color: var(--text); text-decoration: none; background: var(--glass-2); }
    .nav-link:active { opacity: 0.8; }
    .nav-link.active {
      color: #fff;
      background: var(--accent);
    }

    @media (max-width: 480px) {
      .nav { padding: var(--space-2) var(--space-2); }
      .nav-links { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      .nav-links::-webkit-scrollbar { display: none; }
      .nav-link { font-size: 12px; padding: 6px 12px; white-space: nowrap; }
      .nav-home { width: 30px; height: 30px; }
      .nav-sep { height: 16px; margin: 0 2px; }
    }

    /* App container */
    #app {
      max-width: var(--wrap); margin: 0 auto;
      padding: var(--space-4) var(--space-5) var(--space-4);
      min-height: calc(100vh - 60px);
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <nav class="nav">
    <div class="nav-links">
      <a class="nav-home" href="/" title="Back to home" onclick="if(location.port){event.preventDefault();location.hash='library'}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
      <div class="nav-sep"></div>
      <a class="nav-link" href="#extract" data-route="extract">Extract</a>
      <a class="nav-link" href="#interview" data-route="interview">Interview</a>
      <a class="nav-link" href="#consult" data-route="consult">Consult</a>
      <a class="nav-link" href="#library" data-route="library">Library</a>
      <a class="nav-link" href="#packs" data-route="packs">Packs</a>
      <a class="nav-link" href="#process" data-route="process">Process</a>
    </div>
  </nav>

  <div id="app"></div>

  <script type="module" src="store.js"></script>
  <script type="module" src="host.js"></script>
</body>
</html>
